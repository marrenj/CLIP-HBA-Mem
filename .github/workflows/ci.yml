name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff==0.4.4

      - name: Check style
        run: ruff check CLIP-HBA/ src/

      - name: Check formatting
        run: ruff format --check CLIP-HBA/ src/

  test:
    name: Unit tests (CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU-only PyTorch and core deps
        run: |
          pip install torch==2.2.0+cpu torchvision==0.17.0+cpu \
            --index-url https://download.pytorch.org/whl/cpu
          pip install \
            numpy==1.26.4 \
            scipy==1.13.0 \
            pandas==2.2.1 \
            scikit-learn==1.4.1.post1 \
            pillow==10.3.0 \
            tqdm==4.66.2 \
            transformers==4.40.0 \
            peft==0.10.0 \
            pytest==8.1.1

      - name: Run tests
        run: pytest tests/ -v --tb=short
