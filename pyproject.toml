[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "clip-hba-mem"
version = "1.0.0"
requires-python = ">=3.11"
description = "Memorability prediction built on a frozen CLIP-HBA-Behavior backbone"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
